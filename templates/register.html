{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7"><div class="card p-4">
  <h4 class="mb-3">Patient Registration</h4>
  <form method="post" class="row g-3">
    <div class="col-md-6"><label class="form-label">Username*</label><input name="username" class="form-control" minlength="3" required value="{{ form.get('username','') }}"></div>
    <div class="col-md-6"><label class="form-label">Password*</label><input type="password" name="password" class="form-control" minlength="6" required></div>
    <div class="col-md-12"><label class="form-label">Full name*</label><input name="name" class="form-control" required value="{{ form.get('name','') }}"></div>
    <div class="col-md-4"><label class="form-label">Age</label><input type="number" name="age" min="1" max="129" class="form-control" value="{{ form.get('age','') }}"></div>
    <div class="col-md-4"><label class="form-label">Gender</label>
      <select name="gender" class="form-select"><option value="">-</option>{% for g_ in ['Male','Female','Other'] %}<option {{ 'selected' if form.get('gender')==g_ }}>{{ g_ }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Phone</label><input name="phone" pattern="[0-9+\- ]{7,15}" class="form-control" value="{{ form.get('phone','') }}"></div>
    <div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2">{{ form.get('address','') }}</textarea></div>
    <div class="col-12"><button class="btn btn-primary">Register</button></div>
  </form>
</div></div></div>
{% endblock %}
