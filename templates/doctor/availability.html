{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">My availability &mdash; next 7 days</h3>
<form method="post"><div class="card p-3">
<div class="table-responsive"><table class="table text-center align-middle"><thead><tr><th>Date</th>{% for s in slots %}<th>{{ s }}</th>{% endfor %}</tr></thead><tbody>
{% for d in days %}<tr><td class="text-start fw-semibold">{{ d }}</td>
{% for s in slots %}<td><input class="form-check-input" type="checkbox" name="slots" value="{{ d }}|{{ s }}" {{ 'checked' if (d ~ '|' ~ s) in current }}></td>{% endfor %}</tr>{% endfor %}
</tbody></table></div>
<div class="small text-muted mb-2">Slots that already have a patient stay available automatically.</div>
<div><button class="btn btn-primary">Save availability</button></div></div></form>
{% endblock %}
