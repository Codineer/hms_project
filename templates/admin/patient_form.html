{% extends "base.html" %}
{% block content %}
<div class="card p-4"><h4 class="mb-3">Edit Patient #{{ p.id }}</h4>
<form method="post" class="row g-3">
<div class="col-md-6"><label class="form-label">Name*</label><input name="name" class="form-control" required value="{{ p.name }}"></div>
<div class="col-md-3"><label class="form-label">Age</label><input type="number" name="age" min="1" class="form-control" value="{{ p.age or '' }}"></div>
<div class="col-md-3"><label class="form-label">Gender</label><select name="gender" class="form-select"><option value="">-</option>{% for x in ['Male','Female','Other'] %}<option {{ 'selected' if p.gender==x }}>{{ x }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ p.phone }}"></div>
<div class="col-md-6"><label class="form-label">Address</label><input name="address" class="form-control" value="{{ p.address }}"></div>
<div class="col-12"><button class="btn btn-primary">Save</button> <a class="btn btn-link" href="{{ url_for('admin.patient_detail', patient_id=p.id) }}">Cancel</a></div>
</form></div>
{% endblock %}
