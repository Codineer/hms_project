{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">Find a doctor</h3>
<form class="row g-2 mb-3">
<div class="col-md-4"><input name="q" value="{{ q }}" class="form-control" placeholder="Doctor name or specialization"></div>
<div class="col-md-3"><select name="dept" class="form-select"><option value="">All specializations</option>{% for d in depts %}<option value="{{ d.id }}" {{ 'selected' if dept==(d.id|string) }}>{{ d.name }}</option>{% endfor %}</select></div>
<div class="col-md-3"><select name="date" class="form-select"><option value="">Any day (next 7)</option>{% for d in days %}<option {{ 'selected' if day==d }}>{{ d }}</option>{% endfor %}</select></div>
<div class="col-md-2"><button class="btn btn-primary w-100">Search</button></div></form>
<div class="row g-3">
{% for d, n in doctors %}
<div class="col-md-6"><div class="card p-3 h-100"><h5>{{ d.name }}</h5><div class="text-muted">{{ d.dept or 'General' }} &middot; {{ d.experience }} yrs experience</div>
<p class="small mt-2">{{ d.bio|truncate(110) }}</p>
<div class="d-flex justify-content-between align-items-center mt-auto"><span class="badge {{ 'bg-success' if n else 'bg-secondary' }}">{{ n }} free slot(s)</span>
<a class="btn btn-sm btn-primary" href="{{ url_for('patient.doctor_profile', doctor_id=d.id) }}">Profile &amp; book</a></div></div></div>
{% else %}<p class="text-muted">No doctors match your search.</p>{% endfor %}</div>
{% endblock %}
