{% extends "base.html" %}
{% block content %}
<div class="card p-3"><h5>Reschedule appointment with {{ doc.name }}</h5>
<p class="text-muted">Current: {{ a.date }} at {{ a.time }}</p>
<form method="post"><input type="hidden" name="date" value="">
{% for d, ss in slots.items() %}<div class="mb-2"><strong class="me-2">{{ d }}</strong>
{% for s in ss %}<button name="slot" value="{{ s }}" class="btn btn-outline-primary btn-sm slot-btn" onclick="this.form.date.value='{{ d }}'">{{ s }}</button>{% else %}<span class="text-muted small">No slots</span>{% endfor %}</div>{% endfor %}
</form><a href="{{ url_for('patient.dashboard') }}">&larr; Back</a></div>
{% endblock %}
